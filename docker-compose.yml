services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: salyq
      POSTGRES_PASSWORD: salyq
      POSTGRES_DB: salyq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salyq -d salyq"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine

  api:
    build: .
    environment: &app_env
      SALYQ_DATABASE_URL: postgresql+psycopg://salyq:salyq@db:5432/salyq
      SALYQ_REDIS_URL: redis://redis:6379/0
      # Только для локальной разработки! В проде ключи выдаёт KMS / Vault в РК.
      SALYQ_FIELD_KEY: ZGV2LWZpZWxkLWtleS1kby1ub3QtdXNlLWluLXByb2Q=
      SALYQ_HMAC_KEY: ZGV2LWhtYWMta2V5LS1kby1ub3QtdXNlLWluLXByb2Q=
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Напоминания и курсы НБ РК по расписанию (Celery beat + worker)
  worker:
    build: .
    environment: *app_env
    command: ["celery", "-A", "salyq.worker", "worker", "-B", "--loglevel=info"]
    depends_on:
      - api
      - redis

  # Проверка подписей ЭЦП (НУЦ РК). Включение: docker compose --profile ecp up,
  # а в api — SALYQ_ECP_VERIFIER=ncanode и SALYQ_NCANODE_URL=http://ncanode:14579.
  # Имя образа и порт сверить с документацией NCANode; для тестов нужны тестовые
  # корневые сертификаты с pki.gov.kz.
  ncanode:
    image: ${NCANODE_IMAGE:-malikzh/ncanode}
    profiles: ["ecp"]
    ports:
      - "14579:14579"

  # docker compose run --rm tests
  tests:
    build: .
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://salyq:salyq@db:5432/salyq_test
    command: ["pytest", "-q"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
