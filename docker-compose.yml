services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: salyq
      POSTGRES_PASSWORD: salyq
      POSTGRES_DB: salyq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salyq -d salyq"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      SALYQ_DATABASE_URL: postgresql+psycopg://salyq:salyq@db:5432/salyq
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # docker compose run --rm tests
  tests:
    build: .
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://salyq:salyq@db:5432/salyq_test
    command: ["pytest", "-q"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
