[project]
name = "salyq"
version = "0.1.0"
description = "ИИ-бухгалтер для ИП на упрощённом режиме (Казахстан) — бэкенд"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["salyq*"]

[tool.setuptools.package-data]
"salyq.tax" = ["rates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: тесты, которым нужен реальный PostgreSQL (TEST_DATABASE_URL)"]
